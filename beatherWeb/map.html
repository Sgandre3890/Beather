<!DOCTYPE html>
<html>
<head>
  <title>Weather Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <link rel="stylesheet" href="style.css" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    /* Keep original full-screen map look */
    #map { width: 100vw; height: 100vh; }
    /* Keep nav at top-left, but shift right just enough to avoid Leaflet zoom (slightly less offset) */
    nav { left: 45px; right: auto; }
    /* Heat toggle button (top-right, above map controls) */
    #heat-toggle {
      position: fixed;
      top: 8px;
      right: 8px;
      z-index: 3001; /* above nav/map */
      padding: 6px 10px;
      border-radius: 8px;
      border: none;
      background: rgba(255, 152, 0, 0.92);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
      font-family: inherit;
    }
    #heat-toggle.off { background: rgba(96, 125, 139, 0.92); }
  </style>
  
</head>
<body>
  <nav>
    <a href="index.html" title="Home">
      <img src="../Images/Home.png" alt="Home" data-i18n="nav.home" />
    </a>
  </nav>

  <div id="map"></div>
  <!-- Heat toggle (temp layer visibility) -->
  <button id="heat-toggle" title="Toggle heat layer">Heat: ON</button>

  <script>
    // Original immediate initialization
    var map = L.map('map').setView([40.7608, -111.8910], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);
    // Temperature overlay (managed via toggle)
    var tempLayer = L.tileLayer('https://tile.openweathermap.org/map/temp/{z}/{x}/{y}.png?appid=04b2c70f5678cb788cb9d62c0325ef32', {
      attribution: '© OpenWeatherMap',
      opacity: 0.5
    });
    // Restore persisted state; default to enabled
    var heatEnabled = localStorage.getItem('map_heat_enabled');
    heatEnabled = (heatEnabled === null) ? true : (heatEnabled === 'true');
    if (heatEnabled) { tempLayer.addTo(map); }
    var heatBtn = document.getElementById('heat-toggle');
    function updateHeatBtn() {
      if (!heatBtn) return;
      heatBtn.textContent = heatEnabled ? 'Heat: ON' : 'Heat: OFF';
      heatBtn.classList.toggle('off', !heatEnabled);
    }
    updateHeatBtn();
    if (heatBtn) {
      heatBtn.addEventListener('click', function(){
        heatEnabled = !heatEnabled;
        localStorage.setItem('map_heat_enabled', String(heatEnabled));
        if (heatEnabled) {
          tempLayer.addTo(map);
        } else {
          try { map.removeLayer(tempLayer); } catch(e) {}
        }
        updateHeatBtn();
      });
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="style.css">
	<link rel="stylesheet" href=
"https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
	<link rel="stylesheet" href=
"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
	<link rel="stylesheet" href=
"https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap">
	<title>Beather</title>
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<style>
		/* 防闪烁与平滑淡入 */
		.weather-video {
			opacity: 0;
			transition: opacity .25s ease;
			will-change: opacity;
			backface-visibility: hidden;
			position: fixed;
			left: 0; top: 0; width: 100vw; height: 100vh;
			object-fit: cover;
			z-index: -1; /* 位于背景层之下，不与前景交叠重绘 */
		}
		.weather-video.show {
			opacity: 1;
		}
		/* 背景容器确保不闪 */
		.page-bg {
			/* 可设置一张静态背景图作为占位 */
			background: #000 url('../Images/weatherbackground/background.jpg') center/cover no-repeat;
			/* 防重绘抖动 */
			will-change: transform;
			backface-visibility: hidden;
			position: fixed;
			left: 0; top: 0; width: 100vw; height: 100vh;
			z-index: -2;
		}
	</style>
</head>


<body>
	<!-- Splash screen -->
	<div id="splash-screen" class="splash-screen">
		<img src="../Images/BeatherLogo2.png" alt="Beather Logo" class="splash-logo">
	</div>
	
	<!-- Background video (looping MP4) -->
	<div id="page-bg" class="page-bg"></div>
	<video id="weather-video" class="weather-video" autoplay muted loop playsinline preload="auto" poster="../Images/weatherbackground/background.jpg" style="visibility:hidden;">
		<source src="../Images/weatherbackground/background.mp4" type="video/mp4">
	</video>

	<!-- Game selection menu -->
	<div id="game-menu" class="hidden">
		<div class="game-menu-content">
			<h2 data-i18n="game.choose">Choose a Game</h2>
			<div class="game-list">
			<div class="game-card" data-game="sunny">
				<img src="../Images/WebAssets/SunnyIcon.svg" alt="Sunny Clicker" />
				<div class="game-card-title" data-i18n="game.sunny.title">Sunny Clicker</div>
					<div class="game-card-desc" data-i18n="game.sunny.desc">Click suns, avoid distractors. Frenzy & bonuses included.</div>
				</div>
			<div class="game-card" data-game="flappy">
				<img src="../Images/clouds/funnycloud.png" alt="Flappy Cloud" />
				<div class="game-card-title" data-i18n="game.flappy.title">Flappy Cloud</div>
					<div class="game-card-desc" data-i18n="game.flappy.desc">Tap to fly the cloud. Don't hit the ground or the pillars.</div>
				</div>
			</div>
			<button id="game-menu-cancel" class="menu-btn">Cancel</button>
		</div>
	</div>

	<!-- Generic Game Overlay (selected game content will be injected) -->
	<div id="game-overlay" class="hidden">
		<div class="game-content">
			<h2 id="game-title">Game</h2>
			<div id="game-info-row">
				<div id="game-timer">-</div>
				<div id="game-score">Score: 0</div>
				<div id="best-score" style="margin-left:12px;">Best: 0</div>
			</div>
			<div id="frenzy-banner" class="hidden">FRENZY! +5s paused  All clicks +1</div>
			<div id="game-area"></div>
			<div style="display:flex;gap:8px;justify-content:center;margin-top:8px;">
				<button id="game-exit">Exit Game</button>
				<button id="game-restart">Restart</button>
			</div>
		</div>
	</div>


	<!-- Background audio -->
	<audio id="weather-audio" class="weather-audio" loop>
		<source src="../Images/weatherbackground/Backgroundmusic.mp3" type="audio/mpeg">
	</audio>

	<!-- Control buttons (bottom-right) -->
	<div class="controls">
		<div style="display: flex; gap: 8px; align-items: center;">
			<button id="gamepad-btn" class="control-btn gamepad-btn" title="Play Game">
				<i class="fas fa-gamepad"></i>
			</button>
			<button id="settings-btn" class="control-btn settings-btn" title="Settings">
				<i class="fas fa-cog"></i>
			</button>
		</div>
		<!-- Note: removed separate enable-sound button; audio enable is merged into the audio toggle button. -->
	</div>

			<nav>
				<a href="map.html" title="Weather Map">
					<img src="../Images/map.png" alt="Weather Map" data-i18n="nav.map" />
				</a>
			</nav>

	<div class="container">
		<div class="weather-card">
			<img src="../Images/BeatherLogo.png" alt="Beather Logo" class="header-logo">
			<h1>
				<img src="../Images/Beather.png" alt="Beather logo" class="logo">
			</h1>
			<h3>
				<span data-i18n="headline">Weather App — The best weather app</span>
			</h3>
			<input type="text" id="city-input"
				placeholder="Enter city name" data-i18n-placeholder="input.city">
						<button id="city-input-btn" data-i18n="btn.getWeather">
					Get Weather
			</button>
			<div id="weather-info"
				class="animate__animated animate__fadeIn">
				<h3 id="city-name"></h3>
				<p id="date" data-i18n="label.date"></p>
				<p id="temperature" data-i18n="label.temperature"></p>
				<p id="description" data-i18n="label.description"></p>
				<p id="wind-speed" data-i18n="label.wind"></p>
			</div>
		</div>
	</div>
	<script src=
"https://momentjs.com/downloads/moment-with-locales.min.js">
	</script>
	<script src="script.js"></script>

	<!-- Settings Modal -->
	<div id="settings-modal" class="settings-modal hidden">
		<div class="settings-content">
			<h2 data-i18n="settings.title">Settings</h2>
			<div class="settings-section">
				<h3 data-i18n="settings.media">Media</h3>
				<label class="settings-row">
					<input type="checkbox" id="set-audio-enabled" />
					<span data-i18n="settings.audio">Enable Audio</span>
				</label>
				<label class="settings-row">
					<input type="checkbox" id="set-video-enabled" />
					<span data-i18n="settings.video">Enable Background Video</span>
				</label>
				<label class="settings-row">
					<span data-i18n="settings.volume">Volume</span>
					<input type="range" id="set-volume" min="0" max="100" step="1" style="width:180px;margin-left:10px;" />
				</label>
				<label class="settings-row">
					<span data-i18n="settings.display">Display</span>
					<label style="margin-left:10px;"><input type="checkbox" id="set-display-temp" checked /> <span data-i18n="btn.showTemp">Show Temperature</span></label>
					<label style="margin-left:10px;"><input type="checkbox" id="set-display-wind" checked /> <span data-i18n="btn.showWind">Show Wind</span></label>
				</label>
			</div>

			<div class="settings-section">
				<h3 data-i18n="settings.localization">Localization</h3>
				<label class="settings-row">
					<span data-i18n="ctrl.language">Language</span>
					<select id="set-language" style="margin-left:10px;">
						<option value="en">English</option>
						<option value="zh_cn">中文</option>
						<option value="es">Español</option>
					</select>
				</label>
				<label class="settings-row">
					<span data-i18n="units.title">Units</span>
					<select id="set-units" style="margin-left:10px;">
						<option value="auto" data-i18n="units.auto">Auto</option>
						<option value="metric" data-i18n="units.metric">Metric (°C, m/s)</option>
						<option value="imperial" data-i18n="units.imperial">Imperial (°F, mph)</option>
					</select>
				</label>
			</div>

			<div class="settings-section">
				<h3 data-i18n="settings.location">Location</h3>
				<label class="settings-row">
					<input type="checkbox" id="set-auto-detect" />
					<span data-i18n="settings.autoDetect">Auto detect location</span>
					<button id="set-detect-now" class="mini-btn" style="margin-left:10px;" data-i18n="settings.detectNow">Detect Now</button>
				</label>
				<label class="settings-row">
					<span data-i18n="settings.manualCity">Manual city</span>
					<input id="set-manual-city" type="text" data-i18n-placeholder="input.city" placeholder="Enter city name" style="margin-left:10px;" />
					<button id="set-fetch-city" class="mini-btn" style="margin-left:10px;" data-i18n="settings.fetchWeather">Fetch Weather</button>
				</label>
			</div>

			<div class="settings-actions">
				<button id="settings-restore" class="menu-btn" data-i18n="settings.restoreDefaults">Restore Defaults</button>
				<button id="settings-cancel" class="menu-btn" data-i18n="btn.cancel">Cancel</button>
				<button id="settings-save" class="menu-btn primary" data-i18n="settings.save">Save</button>
			</div>
		</div>
	</div>
	<!-- 在 body 结束前插入：命名规则与国家→首都映射 -->
	<script>
		(function () {
			const tinyStates = new Set([
				'singapore','新加坡','monaco','摩纳哥','vatican city','梵蒂冈',
				'san marino','圣马力诺','andorra','安道尔','liechtenstein','列支敦士登',
				'luxembourg','卢森堡','malta','马耳他'
			]);

			// 国家名（中英常见写法）→ 首都及国家信息
			const capitals = {
				// 美国
				'united states':'Washington, US','usa':'Washington, US','us':'Washington, US','america':'Washington, US','美国':'Washington, US',
				// 俄罗斯
				'russia':'Moscow, RU','russian federation':'Moscow, RU','俄罗斯':'Moscow, RU',
				// 中国
				'china':'Beijing, CN','prc':'Beijing, CN','中国':'Beijing, CN',
				// 日本
				'japan':'Tokyo, JP','日本':'Tokyo, JP',
				// 英国
				'united kingdom':'London, GB','uk':'London, GB','britain':'London, GB','英国':'London, GB',
				// 法国
				'france':'Paris, FR','法国':'Paris, FR',
				// 德国
				'germany':'Berlin, DE','德国':'Berlin, DE',
				// 加拿大
				'canada':'Ottawa, CA','加拿大':'Ottawa, CA',
				// 澳大利亚
				'australia':'Canberra, AU','澳大利亚':'Canberra, AU',
				// 印度
				'india':'New Delhi, IN','印度':'New Delhi, IN',
				// 巴西
				'brazil':'Brasilia, BR','巴西':'Brasilia, BR',
				// 意大利
				'italy':'Rome, IT','意大利':'Rome, IT',
				// 西班牙
				'spain':'Madrid, ES','西班牙':'Madrid, ES',
				// 韩国
				'south korea':'Seoul, KR','korea, republic of':'Seoul, KR','korea':'Seoul, KR','韩国':'Seoul, KR',
				// 墨西哥
				'mexico':'Mexico City, MX','墨西哥':'Mexico City, MX',
				// 土耳其
				'turkey':'Ankara, TR','土耳其':'Ankara, TR',
				// 沙特
				'saudi arabia':'Riyadh, SA','沙特阿拉伯':'Riyadh, SA',
				// 阿联酋
				'united arab emirates':'Abu Dhabi, AE','uae':'Abu Dhabi, AE','阿联酋':'Abu Dhabi, AE',
				// 新加坡（微型国家，保留本名）
				'singapore':'Singapore','新加坡':'Singapore'
			};

			// 常见城市中→英映射（可扩展）
			const cityZhByEn = {
				'Changchun':'长春',
				'Tokyo':'东京',
				'Beijing':'北京',
				'Moscow':'莫斯科',
				'Washington':'华盛顿',
				'Salt Lake City':'盐湖城',
				'Singapore':'新加坡',
				'Seoul':'首尔',
				'London':'伦敦',
				'Paris':'巴黎',
				'Berlin':'柏林',
				'Madrid':'马德里',
				'Rome':'罗马'
			};

			function getLang() {
				const v = document.getElementById('set-language')?.value || 'en';
				return v === 'zh_cn' ? 'zh_cn' : (v === 'es' ? 'es' : 'en');
			}

			function toKey(s) {
				return (s || '').trim().toLowerCase();
			}

			// 判断是否包含非拉丁字符（用于决定是否加括号显示双语）
			function hasNonLatin(s) {
				return /[^\u0000-\u007F]/.test(s || '');
			}

			// 供地图页复用的格式化函数
			function formatPlaceLabel(localOrOriginal, enName, lang) {
				const langUse = lang || getLang();
				const en = (enName || '').trim();
				const local = (localOrOriginal || '').trim();
				if (langUse === 'zh_cn') {
					const zh = cityZhByEn[en] || local; // 优先翻译，否则用本地/原名
					if (!zh) return en || local;
					// 中文为主，括号补英文
					return en && en !== zh ? `${zh} (${en})` : zh;
				}
				// 英文为主，如果本地名是非拉丁或与英文不同，则括号补充
				const main = en || local;
				if (!main) return local;
				if (local && local !== en && hasNonLatin(local)) return `${local} (${en})`;
				return main;
			}

			// 预处理首页搜索：国家名 → 首都（非微型国家）
			function preprocessSearchValue(raw) {
				const key = toKey(raw);
				// 微型国家：保留
				if (tinyStates.has(key)) return raw;
				// 映射到首都
				if (capitals[key]) return capitals[key];
				return raw;
			}

			// 捕获阶段预处理按钮点击与回车提交，确保在 script.js 读取前完成
			(function wireSearchPreprocess() {
				const input = document.getElementById('city-input');
				const btn = document.getElementById('city-input-btn');
				if (!input || !btn) return;

				const handle = () => {
					input.value = preprocessSearchValue(input.value);
				};

				btn.addEventListener('click', handle, true);
				input.addEventListener('keydown', (e) => {
					if (e.key === 'Enter') handle();
				}, true);
			})();

			// 观察 #city-name 内容变化，按语言规则重写展示
			(function observeCityName() {
				const el = document.getElementById('city-name');
				if (!el) return;

				let formatting = false;
				const apply = () => {
					if (formatting) return;
					const lang = getLang();
					const raw = (el.textContent || '').trim();
					if (!raw) return;

					// 解析格式：City[, Country/Code]
					const cityPart = raw.split(',')[0].trim();
					const enGuess = cityPart; // 视为英文名的近似
					const formatted = formatPlaceLabel(cityPart, enGuess, lang);

					if (formatted && formatted !== raw) {
						formatting = true;
						el.textContent = formatted;
						formatting = false;
					}
				};

				// 初次与变化时应用
				apply();
				const mo = new MutationObserver(apply);
				mo.observe(el, { childList: true, characterData: true, subtree: true });

				// 切换语言时也刷新
				const langSel = document.getElementById('set-language');
				if (langSel) langSel.addEventListener('change', apply);
			})();

			// 暴露到全局，供地图页调用：BeatherNameKit.formatPlaceLabel(localName, englishName, lang?)
			window.BeatherNameKit = {
				formatPlaceLabel,
				preprocessSearchValue
			};
		})();
	</script>
	<script>
		// 背景视频淡入，避免闪烁（隐藏至首帧就绪，双 RAF 后再显示）
		(function fixBgFlicker() {
			var vid = document.getElementById('weather-video');
			if (!vid) return;

			function revealSmooth() {
				// 双 RAF 确保样式与帧队列稳定再显示
				requestAnimationFrame(function(){
					requestAnimationFrame(function(){
						vid.style.visibility = 'visible';
						if (!vid.classList.contains('show')) vid.classList.add('show');
					});
				});
			}

			function tryPlay() {
				// 某些浏览器需要显式 play 才开始渲染
				var p = vid.play && vid.play();
				if (p && typeof p.then === 'function') {
					p.then(function(){ /* playing */ }).catch(function(){ /* autoplay 失败也保持 poster */ });
				}
			}

			function onReady() {
				tryPlay();
				revealSmooth();
			}

			vid.addEventListener('loadedmetadata', onReady, { once: true });
			vid.addEventListener('loadeddata', onReady, { once: true });
			vid.addEventListener('canplay', onReady, { once: true });

			// 超时兜底：若 1.5s 后已可渲染则显示；否则维持 poster 与静态背景
			setTimeout(function(){
				if (vid.readyState >= 2) onReady();
			}, 1500);
		})();
	</script>
</body>
</html>
